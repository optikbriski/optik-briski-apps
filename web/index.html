<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Rekasa POS — merek toko mengikuti usaha Anda">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Rekasa">
  <link rel="apple-touch-icon" href="rekasa-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="rekasa-icon.png"/>

  <title>Rekasa</title>
  <style>
    html, body { height: 100%; margin: 0; background: #F7FAFF; }
    .obr-boot {
      position: fixed; inset: 0; display: flex; align-items: center;
      justify-content: center; gap: 12px; background: #F7FAFF; z-index: 9999;
      transition: opacity .25s ease;
    }
    .obr-boot .rks-badge {
      width: 40px; height: 40px; border-radius: 9px; background: #0B3D8C;
      color: #fff; font: 800 22px/40px system-ui, -apple-system, sans-serif;
      text-align: center;
    }
    .obr-boot .rks-word {
      font: 800 26px/1 system-ui, -apple-system, sans-serif;
      color: #0B3D8C; letter-spacing: .04em;
    }
    .obr-boot.dark { background: #0B1220; }
    .obr-boot.dark .rks-word { color: #F7FAFF; }
  </style>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
  
  <link rel="manifest" href="manifest.json">

  <!--
    Google Maps JavaScript API — required for Admin Geofence editor (web).
    Build/Vercel replaces __GOOGLE_MAPS_API_KEY__ from env GOOGLE_MAPS_API_KEY.
    Enable Maps JavaScript API + billing on Google Cloud.
  -->
  <script src="https://maps.googleapis.com/maps/api/js?key=__GOOGLE_MAPS_API_KEY__"></script>
</head>
<body>
  <div class="obr-boot" id="obr-boot">
    <div class="rks-badge" aria-hidden="true">R</div>
    <div class="rks-word">Rekasa</div>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('obr-boot');
      if (!el) return;
      el.style.opacity = '0';
      setTimeout(function () { el.remove(); }, 280);
    });
  </script>
</body>
</html>
